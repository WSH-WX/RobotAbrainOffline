services:
  rabbitbot-nav:
    image: ${RABBITBOT_PORTABLE_NAV_IMAGE:-ghcr.io/aaronai/rabbitbot-nav-portable:20260611}
    build:
      context: ${RABBITBOT_AIR_ROOT:-..}
      dockerfile: rabbitbot-dev-ros2-master/docker/portable/nav.Dockerfile
    network_mode: host
    environment:
      RABBITBOT_DDS_INTERFACE: ${RABBITBOT_DDS_INTERFACE:-eno1}
      RABBITBOT_NAV_MAP_PATH: ${RABBITBOT_NAV_MAP_PATH:-/home/unitree/test9.pcd}
      RABBITBOT_PORTABLE_PROJECT_ROOT: ${RABBITBOT_PROJECT_ROOT:-/workspace/projects/rabbitbot-dev-ros2-master}
    volumes:
      - ${RABBITBOT_AIR_ROOT:-..}/rabbitbot-dev-ros2-master/logs/nav_workflow_control:/workspace/projects/rabbitbot-dev-ros2-master/logs/nav_workflow_control
      - ${RABBITBOT_AIR_ROOT:-..}/unitree_slam_example_new/example/run_logs:/workspace/projects/unitree_slam_example_new/example/run_logs
    restart: unless-stopped
